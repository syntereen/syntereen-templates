name = prod logging config file
status = warn
monitorInterval = 30

appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %date %level %logger %message%n%throwable

rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = STDOUT

logger.recj.name = com.syntereen.recj
logger.recj.level = info
logger.recj.additivity = false
logger.recj.appenderRef.console.ref = STDOUT
